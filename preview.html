<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Golden Lab — an interactive laboratory for Fibonacci and the golden angle.">
  <title>GOLDEN LAB — Mathematical Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{--bg:#050505;--panel:#0b0b0b;--panel-raised:#10100e;--text:#f1efe9;--muted:#85837b;--line:#26241f;--gold:#d8a84e;--gold-bright:#f3cf78;--glow-strength:.42;--mono:'DM Mono',monospace;--sans:Manrope,Arial,sans-serif;color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-width:320px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-bright);outline-offset:4px}
::selection{background:#a47c33;color:#fff}

.app-shell{min-height:100svh;position:relative;overflow:hidden}
.overview{max-width:1600px;margin:auto;padding:42px clamp(24px,5vw,90px) 75px;transition:opacity .45s,filter .45s,transform .65s cubic-bezier(.2,.75,.2,1)}
.overview.dimmed{opacity:.12;filter:blur(5px);transform:scale(.965);pointer-events:none}
.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;color:var(--muted);font:11px var(--mono);letter-spacing:.16em}
.brand{color:var(--text);font-family:var(--sans);font-weight:800;letter-spacing:.24em;font-size:13px}
.brand span{color:var(--gold)}
.hero{display:flex;align-items:end;justify-content:space-between;gap:35px;padding:clamp(55px,7vw,104px) 0 52px}
.eyebrow{font:11px var(--mono);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.hero h1{font-size:clamp(58px,8vw,128px);line-height:.92;letter-spacing:-.085em;margin:20px 0 0;font-weight:600}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{max-width:310px;color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 6px}
.gallery-head{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:18px 0 22px;color:var(--muted);font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.experiment-card{position:relative;text-align:left;overflow:hidden;padding:0;border:1px solid #24231f;border-radius:3px;background:#0a0a09;color:var(--text);min-height:clamp(310px,29vw,445px);transition:transform .6s cubic-bezier(.2,.8,.2,1),border-color .5s,box-shadow .5s;isolation:isolate}
.experiment-card:hover,.experiment-card:focus-visible{transform:scale(1.018);border-color:#665332;box-shadow:0 12px 60px rgba(186,131,42,.07)}
.card-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.experiment-card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.64) 75%,#080808 100%);pointer-events:none}
.card-index{position:absolute;z-index:1;top:24px;left:26px;color:var(--gold);font:11px var(--mono);letter-spacing:.15em}
.card-symbol{position:absolute;z-index:1;top:20px;right:26px;color:#cbaa66;font:30px Georgia,serif}
.card-info{position:absolute;z-index:1;bottom:25px;left:27px;right:27px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}
.card-info h2{font-size:clamp(25px,2.7vw,39px);letter-spacing:-.055em;font-weight:500;margin:0 0 7px}
.card-info p{color:#97938a;font-size:12px;margin:0}
.open-hint{color:var(--gold);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.open-hint span{display:inline-block;transition:transform .3s}
.experiment-card:hover .open-hint span{transform:translateX(5px)}
.footer{display:flex;justify-content:space-between;margin-top:28px;color:#77746d;font:10px var(--mono);letter-spacing:.1em}

.workspace{position:fixed;inset:0;z-index:10;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .42s,visibility .42s}
.workspace.visible{opacity:1;visibility:visible;pointer-events:auto}
.workspace-frame{height:100%;display:flex;flex-direction:column;padding:24px clamp(22px,3vw,50px) 28px}
.workspace-top{display:flex;align-items:center;justify-content:space-between;min-height:47px;border-bottom:1px solid var(--line);padding-bottom:17px}
.back-button{border:0;background:none;color:var(--text);font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase;padding:12px 0}
.back-button span{color:var(--gold);font-size:17px;margin-right:12px;vertical-align:-1px}
.workspace-counter{font:10px var(--mono);color:var(--muted);letter-spacing:.13em}
.workspace-body{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:clamp(20px,2.4vw,42px);padding-top:25px}
.stage{position:relative;min-height:0;overflow:hidden;background:#050505;border:1px solid #1d1c19}
.stage canvas{display:block;width:100%;height:100%}
.stage-label{position:absolute;left:22px;bottom:19px;color:#8e8b81;font:10px var(--mono);letter-spacing:.12em;pointer-events:none}
.stage-top-label{position:absolute;top:20px;left:22px;color:var(--gold);font:10px var(--mono);letter-spacing:.15em;pointer-events:none}
.control-panel{overflow:auto;min-height:0;padding:0 5px 20px 0;scrollbar-width:thin;scrollbar-color:#40392c transparent}
.panel-kicker{font:10px var(--mono);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;margin:5px 0 13px}
.panel-title{font-size:33px;line-height:1.06;font-weight:500;letter-spacing:-.06em;margin:0}
.panel-description{font-size:12px;line-height:1.65;color:var(--muted);margin:13px 0 27px}
.control-section{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}
.section-label{font:10px var(--mono);color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:20px}
.control{display:block;margin:0 0 20px}
.control-label{display:block;color:#bcb9b1;font-size:12px;font-weight:600;letter-spacing:.02em}
.control-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.control-value{font:11px var(--mono);color:var(--gold)}
input[type=range]{width:100%;height:20px;appearance:none;background:transparent;cursor:pointer;margin:0;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#4b4538}
input[type=range]::-moz-range-track{height:2px;background:#4b4538}
input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 9px #d5a54a70}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--gold-bright)}
.number-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.number-row input{min-width:0;flex:1;height:35px;border:1px solid #35322b;border-radius:2px;background:#10100e;color:var(--text);text-align:center;font:13px var(--mono)}
.number-row input::-webkit-inner-spin-button{appearance:none}
.unit{font:11px var(--mono);color:var(--muted)}
.button{background:#12110f;border:1px solid #363126;border-radius:2px;color:var(--text);padding:11px 13px;font:11px var(--mono);letter-spacing:.04em;transition:transform .18s,background .2s,border-color .2s,box-shadow .2s}
.button:hover{background:#221d13;border-color:#8b6a36}
.button:active{transform:scale(.96)}
.button.primary{background:#a9782d;color:#090909;border-color:#d8a84e;font-weight:500}
.button.primary:hover{background:#d6a653}
.square-button{width:36px;height:35px;padding:0;font-size:17px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions .button{flex:1;min-width:65px}
.toggle-control{display:flex;align-items:center;justify-content:space-between;color:#bcb9b1;font-size:12px;cursor:pointer;margin:0 0 15px}
.toggle-control input{position:absolute;opacity:0}
.toggle-track{width:31px;height:17px;border-radius:20px;background:#322f28;border:1px solid #504635;position:relative;transition:background .2s}
.toggle-track:after{content:'';width:9px;height:9px;border-radius:50%;background:#b7aa91;position:absolute;left:3px;top:3px;transition:transform .2s,background .2s}
.toggle-control input:checked+.toggle-track{background:#88652f}
.toggle-control input:checked+.toggle-track:after{background:#ffe2a0;transform:translateX(14px)}
.toggle-control input:focus-visible+.toggle-track{outline:2px solid var(--gold);outline-offset:3px}

.angle-control{margin:17px 0 30px;--angle-glow:0}
.angle-readout{font:16px var(--mono);color:var(--gold-bright);font-variant-numeric:tabular-nums}
.angle-track-area{position:relative;height:44px;touch-action:none;cursor:ew-resize}
.angle-track{position:absolute;top:21px;left:0;right:0;height:3px;background:#39352d}
.angle-active{height:100%;background:var(--gold);box-shadow:0 0 calc(4px + var(--angle-glow)*17px) rgba(240,188,74,.65)}
.angle-thumb{position:absolute;top:50%;width:15px;height:15px;border:2px solid var(--gold-bright);border-radius:50%;background:#17130b;transform:translate(-50%,-50%);box-shadow:0 0 calc(5px + var(--angle-glow)*25px) rgba(240,186,68,.78)}
.golden-marker{position:absolute;top:0;transform:translateX(-50%);border:0;background:transparent;color:var(--gold-bright);width:26px;height:20px;font:18px Georgia,serif;z-index:2;padding:0;text-shadow:0 0 calc(5px + var(--angle-glow)*20px) #dca944}
.golden-marker:after{content:'';position:absolute;top:21px;height:7px;width:1px;left:50%;background:var(--gold)}
.angle-endpoints{display:flex;justify-content:space-between;position:relative;color:#706d65;font:9px var(--mono)}
.golden-caption{position:absolute;top:0;transform:translateX(-50%);color:var(--gold);font-size:8px;white-space:nowrap}
.angle-control.at-golden .angle-readout{color:#ffe29c}
.golden-status{min-height:18px;color:var(--gold);font:10px var(--mono);letter-spacing:.1em}
.debug{position:absolute;top:20px;right:20px;z-index:2;color:#d7c394;font:10px/1.5 var(--mono);white-space:pre;text-align:right;pointer-events:none}

.mechanics-body{display:block}
.mechanics-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:clamp(20px,2.4vw,42px);min-height:650px;height:calc(100% - 12px)}
.mechanics-stage{background:#070707;border:1px solid #201e19;padding:24px clamp(20px,4vw,64px) 38px}
.mechanics-stage h3{font-size:12px;color:var(--gold);font-weight:500;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0}
.mechanics-roller-section{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1fr);align-items:center;gap:30px;min-height:390px}
.wheel-wrap{position:relative;height:310px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;outline:none;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.wheel-wrap:active{cursor:grabbing}
.wheel-items{position:absolute;inset:0}
.wheel-item{position:absolute;left:0;right:0;top:50%;height:48px;display:flex;align-items:center;justify-content:center;color:var(--text);font:clamp(16px,2.2vw,28px) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;will-change:transform,opacity}
.wheel-item.active{color:var(--gold-bright)}
.wheel-center{position:absolute;left:0;right:0;top:50%;height:56px;transform:translateY(-50%);border-top:1px solid #806536;border-bottom:1px solid #806536;pointer-events:none;box-shadow:0 0 30px #c6972c11}
.wheel-center:before,.wheel-center:after{content:'';position:absolute;width:5px;height:5px;top:25px;background:var(--gold);transform:rotate(45deg)}
.wheel-center:before{left:4px}
.wheel-center:after{right:4px}
.ratio-display{text-align:center}
.ratio-label{font:10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ratio-fraction{font:clamp(20px,2.5vw,35px) var(--mono);letter-spacing:-.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:20px auto 10px;max-width:100%;color:#e9e0d0}
.ratio-value{font:clamp(22px,3vw,44px) var(--mono);color:var(--gold-bright);text-shadow:0 0 calc(var(--ratio-glow,0)*22px) #d5a24488}
.phi-reference{font:11px var(--mono);color:#9a8561;margin-top:16px;text-shadow:0 0 calc(var(--ratio-glow,0)*18px) #daac5088}
.ratio-note{font:10px/1.6 var(--mono);color:var(--muted);margin-top:20px}
.recurrence-section{border-top:1px solid var(--line);padding-top:25px}
.equation-stage{height:175px;display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,25px);overflow:hidden}
.eq-slot{min-width:0;max-width:32%;font:clamp(20px,3.3vw,48px) var(--mono);color:var(--text);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;transition:color .3s;text-align:center}
.eq-slot.result{color:var(--gold-bright)}
.eq-operator{font:clamp(20px,2.7vw,36px) var(--mono);color:#777167}
.eq-slot.enter-forward{animation:eqForward .5s cubic-bezier(.18,.8,.25,1)}
.eq-slot.enter-backward{animation:eqBackward .5s cubic-bezier(.18,.8,.25,1)}
@keyframes eqForward{from{opacity:.25;transform:translateY(22px) scale(.88)}
to{opacity:1;transform:none}
}
@keyframes eqBackward{from{opacity:.25;transform:translateY(-22px) scale(.88)}
to{opacity:1;transform:none}
}
.recurrence-caption{text-align:center;color:var(--muted);font:10px var(--mono);letter-spacing:.1em}

.transition-rect{position:fixed;z-index:30;pointer-events:none;display:flex;align-items:end;padding:clamp(24px,4vw,65px);background-color:#0b0b09;background-size:cover;background-position:center;border:1px solid #685632;box-shadow:0 0 80px #bd913219;transform-origin:top left;color:#f1e7d5;font-size:clamp(24px,4vw,65px);font-weight:500;letter-spacing:-.06em;overflow:hidden}
.hidden{display:none!important}

@media(max-width:900px){.workspace{overflow-y:auto}
.workspace-frame{min-height:100svh;height:auto}
.workspace-body{display:flex;flex-direction:column;overflow:visible}
.stage{height:min(60vh,560px);flex:none}
.control-panel{overflow:visible;padding-bottom:36px}
.mechanics-layout{display:flex;flex-direction:column;height:auto;min-height:0}
.mechanics-stage{overflow:visible}
.mechanics-body{overflow:visible}
}

@media(max-width:650px){.overview{padding:23px 18px 45px}
.topline{font-size:9px}
.hero{display:block;padding:56px 0 35px}
.hero h1{font-size:clamp(58px,15vw,86px)}
.hero p{margin-top:25px}
.gallery{grid-template-columns:1fr;gap:13px}
.experiment-card{min-height:300px}
.card-info h2{font-size:30px}
.open-hint{font-size:9px}
.footer{font-size:8px}
.workspace-frame{padding:16px 15px 25px}
.workspace-body{gap:24px;padding-top:17px}
.stage{height:48vh;min-height:280px}
.panel-title{font-size:29px}
.mechanics-stage{padding:22px 14px}
.mechanics-roller-section{display:block}
.wheel-wrap{height:285px;margin:12px auto;max-width:320px}
.ratio-display{padding:16px 0 30px}
.equation-stage{height:130px;gap:6px}
.eq-slot{font-size:clamp(17px,5vw,29px)}
.golden-caption{font-size:7px}
}

@media(prefers-reduced-motion:reduce){.experiment-card,.overview,.workspace,.button{transition-duration:.12s!important}
.eq-slot.enter-forward,.eq-slot.enter-backward{animation-duration:.14s}
}

.mechanics-body{display:grid}

.mechanics-body .stage{display:none}

.equation-stage{position:relative}

.debug{position:fixed}

.angle-control.pulse .golden-marker{animation:goldenBeat .75s ease-out}

@keyframes goldenBeat{0%{filter:drop-shadow(0 0 0 #f3cf78)}
35%{filter:drop-shadow(0 0 13px #f3cf78)}
100%{filter:drop-shadow(0 0 0 #f3cf78)}
}

@media(prefers-reduced-motion:reduce){.angle-control.pulse .golden-marker{animation:none}
}

/* Shared appearance and transition polish */
html,body,.workspace,.stage,.mechanics-stage{background-color:var(--bg)}
html{scrollbar-gutter:stable}
body.workspace-open{overflow:hidden}
.topline-right,.workspace-top-right{display:flex;align-items:center;gap:24px}
.appearance-button{border:1px solid #39352e;background:#12110f;color:var(--muted);border-radius:999px;padding:7px 10px;font:10px var(--mono);letter-spacing:.08em;white-space:nowrap;transition:border-color .28s,background .28s,color .28s,transform .28s}
.appearance-button:hover{color:var(--text);border-color:#a68855;background:#1b1915;transform:translateY(-1px)}
.appearance-button[aria-pressed="true"]{color:var(--gold-bright);border-color:#655233}
.appearance-button span{margin-left:5px}
.workspace.is-opening .control-panel{opacity:0;transform:translateX(18px)}
.workspace.is-opening .control-panel{transition:opacity .32s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.workspace.is-closing .control-panel{opacity:0;transform:translateX(12px);transition:opacity .16s ease,transform .3s ease}
.workspace.is-closing .stage,.workspace.is-closing .mechanics-stage{filter:brightness(.85);transition:filter .25s}
.button{transition:transform .22s cubic-bezier(.2,.8,.2,1),background .28s,border-color .28s,box-shadow .28s}
.button:hover{transform:translateY(-1px)}
.button:active{transform:translateY(0) scale(.975)}
.experiment-card{transition:transform .75s cubic-bezier(.16,.8,.16,1),border-color .5s,box-shadow .6s}
.experiment-card:hover,.experiment-card:focus-visible{transform:scale(1.015) translateY(-2px)}
.toggle-track,.toggle-track:after{transition-duration:.3s}
@media(max-width:650px){.topline-right>span{display:none}.workspace-top-right{gap:10px}.appearance-button{font-size:9px;padding:6px 8px}.workspace-counter{display:none}}

/* Stage angle instrument */
.angle-readout{color:#eeeae1}
.angle-control.at-golden .angle-readout{color:#ffe4a6}
.stage-angle-overlay{position:absolute;z-index:3;left:24px;right:24px;bottom:20px;padding:11px 17px 5px;background:color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid #39352b;backdrop-filter:blur(9px);box-shadow:0 10px 34px #0006;transition:opacity .35s,transform .4s}
.stage-angle-overlay .angle-control{margin:0 0 8px}
.stage-angle-overlay .angle-readout{font-size:21px}
.stage-angle-overlay .angle-endpoints{font-size:10px}
.stage.has-angle-control .stage-label{display:none}
@media(max-width:650px){.stage-angle-overlay{left:10px;right:10px;bottom:10px;padding:8px 12px 3px}.stage-angle-overlay .angle-readout{font-size:17px}}
.advanced-settings{border-top:1px solid var(--line);margin-top:25px;padding-top:16px}
.advanced-settings summary{display:flex;justify-content:space-between;align-items:center;list-style:none;cursor:pointer;color:#c9c5bb;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 0 15px}
.advanced-settings summary::-webkit-details-marker{display:none}
.advanced-settings summary:before{content:'+';color:var(--gold);font-size:17px;margin-right:12px}
.advanced-settings[open] summary:before{content:'−'}
.advanced-settings summary span{margin-left:auto;color:var(--muted);font-size:9px}
.advanced-settings .control-section{margin-top:5px}
.wheel-item.active{text-shadow:0 0 14px rgba(236,185,85,.38)}
.wheel-center{border-color:#6f6249;box-shadow:0 0 24px rgba(212,166,75,.07)}
.eq-slot{position:relative;display:block;width:31%;height:70px;max-width:31%;min-width:0;overflow:hidden;mask-image:linear-gradient(transparent 0%,#000 18%,#000 82%,transparent 100%)}
.eq-slot .reel-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;color:inherit}
.eq-operator{flex:none}
.transition-rect{background-color:var(--bg)}
/* The hero keeps its headline; the Pascal study stays quiet until invited. */
.hero-aside{width:clamp(280px,27vw,360px);flex:none}
.hero-aside p{max-width:340px;margin:12px 0 6px}
.pascal-region{position:relative;display:block;height:235px;width:100%;background:var(--bg);cursor:crosshair;outline-offset:5px;transition:border-color .4s,transform .5s cubic-bezier(.2,.75,.2,1);border:1px solid transparent}
.pascal-region:hover,.pascal-region:focus-visible{border-color:#363128;transform:translateY(-2px)}
.pascal-region canvas{display:block;width:100%;height:100%}
.pascal-caption{position:absolute;bottom:5px;left:10px;right:10px;display:flex;justify-content:space-between;gap:12px;color:#89857d;font:8px var(--mono);letter-spacing:.1em;pointer-events:none}
.pascal-caption span{color:#aa864e}
@media(max-width:900px){.hero-aside{width:285px}.pascal-region{height:210px}}
@media(max-width:650px){.hero-aside{width:100%;margin-top:30px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.pascal-region{height:220px;max-width:380px;margin:auto}.hero-aside p{margin:0 auto;max-width:380px;text-align:center}}
.section-label,.panel-kicker,.stage-top-label,.card-index{color:#a9a59d}

@media(max-width:900px){.mechanics-body{display:flex;flex-direction:column}
.mechanics-stage{flex:none}
}

/* Quiet controls and a single, contained Mechanics composition. */
.control-panel{scrollbar-width:none;padding-right:2px}
.control-panel .panel-description{margin-bottom:21px}
.control-panel .control-section{padding-top:17px;margin-top:17px}

  <script>
// src/core/animation.js
const GOLDEN_ANGLE = 137.5;
const PHI = (1 + Math.sqrt(5)) / 2;
const TAU = Math.PI * 2;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10*t);
const smoothstep = (a, b, x) => { const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

// Semi-implicit spring integration. Velocities are in units per second.
function springValue(state, target, dt, frequency = 5, damping = 1) {
  const omega = 2 * Math.PI * frequency;
  const acceleration = (target - state.value) * omega * omega - 2 * damping * omega * state.velocity;
  state.velocity += acceleration * dt;
  state.value += state.velocity * dt;
  if (Math.abs(target-state.value) < 0.0001 && Math.abs(state.velocity) < 0.0001) {
    state.value = target; state.velocity = 0;
  }
  return state.value;
}

function smoothDamp(current, target, velocity, smoothTime, dt) {
  const omega = 2 / Math.max(.001, smoothTime);
  const x = omega * dt;
  const decay = 1 / (1 + x + .48*x*x + .235*x*x*x);
  const change = current - target;
  const temp = (velocity + omega*change)*dt;
  return { value: target + (change + temp)*decay, velocity: (velocity - omega*temp)*decay };
}

function animateValue(state, target, dt, time = .28) {
  const next = smoothDamp(state.value, target, state.velocity, reducedMotion ? .06 : time, dt);
  state.value = next.value; state.velocity = next.velocity;
  if (Math.abs(state.value-target) < .0001 && Math.abs(state.velocity) < .0001) { state.value=target; state.velocity=0; }
  return state.value;
}

function loop(callback) {
  let previous = performance.now(), frame = 0;
  function tick(now) {
    const dt = Math.min((now-previous)/1000, .033);
    previous = now;
    if (!document.hidden) callback(dt, now/1000, frame++);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}


// src/core/theme.js

const appearance={value:5,velocity:0,target:5,mode:'graphite',lastTone:5};
function setAppearance(mode){
  appearance.mode=mode==='true-black'?'true-black':'graphite';
  appearance.target=appearance.mode==='true-black'?0:5;
  document.documentElement.dataset.appearance=appearance.mode;
}
function updateAppearance(dt){
  const next=smoothDamp(appearance.value,appearance.target,appearance.velocity,.28,dt);
  appearance.value=next.value;appearance.velocity=next.velocity;
  if(Math.abs(appearance.value-appearance.target)<.005){appearance.value=appearance.target;appearance.velocity=0}
  const tone=Math.round(appearance.value);
  if(tone!==appearance.lastTone){document.documentElement.style.setProperty('--bg',`rgb(${tone}, ${tone}, ${tone})`);appearance.lastTone=tone}
}
function canvasBackground(){const tone=Math.round(appearance.value);return `rgb(${tone}, ${tone}, ${tone})`}
function appearanceMode(){return appearance.mode}


// src/core/canvas.js

function canvasSurface(canvas) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let width = 0, height = 0, ratio = 1;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width*dpr));
    const h = Math.max(1, Math.round(rect.height*dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width=w; canvas.height=h; }
    width=rect.width; height=rect.height; ratio=dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,width,height,ratio};
  }
  return { ctx, resize, get width(){return width}, get height(){return height} };
}

function clear(ctx,w,h) { ctx.fillStyle=canvasBackground(); ctx.fillRect(0,0,w,h); }
function grid(ctx,w,h, spacing=48) {
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.032)'; ctx.lineWidth=1;
  for(let x=w/2%spacing; x<w; x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=h/2%spacing; y<h; y+=spacing){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.restore();
}


// src/ui/controls.js

function section(label) { const el=document.createElement('div'); el.className='control-section'; el.innerHTML=`<div class="section-label">${label}</div>`; return el; }
function button(label, handler, className='') { const b=document.createElement('button'); b.type='button'; b.className=`button ${className}`; b.textContent=label; b.addEventListener('click',handler); return b; }
function actions(items) { const row=document.createElement('div'); row.className='actions'; items.forEach(([label, fn, cls])=>row.append(button(label,fn,cls||''))); return row; }
function numberControl(label, value, min, max, step, onChange, unit='') {
  const wrap=document.createElement('div'); wrap.className='control';
  const title=document.createElement('label'); title.className='control-label'; title.textContent=label;
  const row=document.createElement('div'); row.className='number-row';
  const minus=button('−',()=>commit(Number(input.value)-step),'square-button'); minus.setAttribute('aria-label',`Decrease ${label}`);
  const input=document.createElement('input'); input.type='number'; input.min=min; input.max=max; input.step=step; input.value=value; input.setAttribute('aria-label',label);
  const plus=button('+',()=>commit(Number(input.value)+step),'square-button'); plus.setAttribute('aria-label',`Increase ${label}`);
  const suffix=document.createElement('span'); suffix.className='unit'; suffix.textContent=unit;
  function commit(raw){const safe=Number.isFinite(raw)?raw:value; value=clamp(Math.round(safe/step)*step,min,max); input.value=step<1?value.toFixed(1):value; onChange(value);}
  input.addEventListener('change',()=>commit(Number(input.value))); input.addEventListener('blur',()=>commit(Number(input.value)));
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){commit(Number(input.value));input.blur()}});
  row.append(minus,input,suffix,plus); wrap.append(title,row);
  return {el:wrap,set(v){value=v;input.value=step<1?v.toFixed(1):v}};
}
function rangeControl(label,value,min,max,step,onChange,formatter=v=>String(v)) {
  const wrap=document.createElement('label'); wrap.className='control';
  const top=document.createElement('span'); top.className='control-top';
  const name=document.createElement('span'); name.className='control-label'; name.textContent=label;
  const readout=document.createElement('span'); readout.className='control-value'; readout.textContent=formatter(value);
  const input=document.createElement('input'); input.type='range'; input.min=min;input.max=max;input.step=step;input.value=value;input.setAttribute('aria-label',label);
  const showProgress=v=>input.style.setProperty('--range-percent',`${(v-min)/(max-min)*100}%`);
  showProgress(value);
  input.addEventListener('input',()=>{const v=clamp(Number(input.value),min,max);readout.textContent=formatter(v);showProgress(v);onChange(v)});
  top.append(name,readout);wrap.append(top,input);
  return {el:wrap,set(v){input.value=v;readout.textContent=formatter(v);showProgress(v)}};
}
function toggleControl(label,value,onChange){
  const wrap=document.createElement('label'); wrap.className='toggle-control'; const text=document.createElement('span');text.textContent=label;
  const input=document.createElement('input');input.type='checkbox';input.checked=value;input.addEventListener('change',()=>onChange(input.checked));
  const slider=document.createElement('span');slider.className='toggle-track';wrap.append(text,input,slider);return {el:wrap,set(v){input.checked=v}};
}


// src/ui/slider.js

function angleSlider(label, state, options={}) {
  const root=document.createElement('div');root.className='angle-control';
  root.innerHTML=`<div class="control-top"><span class="control-label">${label}</span><span class="angle-readout">${(state.currentAngle??state.angle).toFixed(1)}°</span></div>
    <div class="angle-track-area"><div class="angle-track"><div class="angle-active"></div></div><div class="angle-thumb"></div><button type="button" class="golden-marker" aria-label="Animate to Golden Angle, 137.5 degrees"><span>φ</span></button></div>
    <div class="angle-endpoints"><span>0.0°</span><span class="golden-caption">137.5° · GOLDEN ANGLE</span><span>360.0°</span></div>`;
  const area=root.querySelector('.angle-track-area'), active=root.querySelector('.angle-active'), thumb=root.querySelector('.angle-thumb'), marker=root.querySelector('.golden-marker'), readout=root.querySelector('.angle-readout');
  marker.style.left=`${GOLDEN_ANGLE/360*100}%`;
  root.querySelector('.golden-caption').style.left=`${GOLDEN_ANGLE/360*100}%`;
  let dragging=false;
  function setTarget(value){state.targetAngle=clamp(Math.round(value*10)/10,0,360);options.onTarget?.(state.targetAngle)}
  function setFromPointer(e){const rect=area.getBoundingClientRect();if(rect.width>0)setTarget((e.clientX-rect.left)/rect.width*360)}
  area.addEventListener('pointerdown',e=>{if(e.target.closest('.golden-marker'))return;dragging=true;area.setPointerCapture(e.pointerId);setFromPointer(e)});
  area.addEventListener('pointermove',e=>{if(dragging)setFromPointer(e)});
  area.addEventListener('pointerup',()=>{dragging=false;if(Math.abs(state.targetAngle-GOLDEN_ANGLE)<.45)setTarget(GOLDEN_ANGLE)});area.addEventListener('pointercancel',()=>dragging=false);
  marker.addEventListener('click',()=>setTarget(GOLDEN_ANGLE));
  area.tabIndex=0;area.setAttribute('role','slider');area.setAttribute('aria-label',label);area.setAttribute('aria-valuemin','0');area.setAttribute('aria-valuemax','360');
  area.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowDown','ArrowRight','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const d=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:-1;setTarget(e.key==='Home'?0:e.key==='End'?360:state.targetAngle+d*.1)}});
  let wasGolden=false;root.addEventListener('animationend',()=>root.classList.remove('pulse'));
  return {el:root,update(glow){const value=state.currentAngle??state.angle;const pct=value/360*100;active.style.width=`${pct}%`;thumb.style.left=`${pct}%`;readout.textContent=`${value.toFixed(1)}°`;area.setAttribute('aria-valuenow',value.toFixed(1));area.setAttribute('aria-valuetext',`${value.toFixed(1)} degrees`);root.style.setProperty('--angle-glow',glow.toFixed(3));const atGolden=Math.abs(value-GOLDEN_ANGLE)<.055;root.classList.toggle('at-golden',atGolden);if(atGolden&&!wasGolden)root.classList.add('pulse');wasGolden=atGolden}};
}


// src/ui/pascal.js



function pascalRows(count){
  const rows=[];let row=[1];
  for(let n=0;n<count;n++){
    rows.push(row);
    const next=Array(n+2).fill(1);
    for(let k=1;k<=n;k++)next[k]=row[k-1]+row[k];
    row=next;
  }
  return rows;
}
// Lucas's theorem for parity: C(n,k) is odd exactly when k's bits are a subset of n's bits.
function isOddPascal(n,k){return (k & (n-k))===0}

const rows=pascalRows(10);
const PASCAL_SEQUENCE_DURATION=7.25;
const ZOOM_START=2.15;
const FINAL_SCALE=.0115;
const DEEP_BANDS=[
  {start:10,end:128,resolution:.34},
  {start:128,end:512,resolution:.10},
  {start:512,end:1024,resolution:.08}
];

// Camera distance gains speed throughout the last 5.1 seconds. Its apex never moves.
function pascalCameraScale(seconds){
  const q=clamp((seconds-ZOOM_START)/(PASCAL_SEQUENCE_DURATION-ZOOM_START),0,1);
  return Math.exp(Math.log(FINAL_SCALE)*q*q);
}

function geometry(width,height){
  const stepX=Math.min(31,(width-22)/9),stepY=Math.min(23,(height-15)/10);
  return {stepX,stepY,apexX:width/2,apexY:(height-stepY*9)/2,cellW:stepX*.78,cellH:stepY*.78};
}

function createBand(spec,{stepX,stepY,cellW,cellH}){
  const halfWidth=(spec.end-1)*stepX/2+cellW/2;
  const xMin=-halfWidth-1/spec.resolution;
  const yMin=spec.start*stepY-cellH/2-1/spec.resolution;
  const logicalWidth=2*halfWidth+2/spec.resolution;
  const logicalHeight=(spec.end-1)*stepY+cellH/2-yMin+1/spec.resolution;
  const bitmap=typeof OffscreenCanvas==='function'
    ?new OffscreenCanvas(Math.ceil(logicalWidth*spec.resolution),Math.ceil(logicalHeight*spec.resolution))
    :document.createElement('canvas');
  bitmap.width=Math.ceil(logicalWidth*spec.resolution);
  bitmap.height=Math.ceil(logicalHeight*spec.resolution);
  const context=bitmap.getContext('2d',{alpha:true});
  context.setTransform(spec.resolution,0,0,spec.resolution,-xMin*spec.resolution,-yMin*spec.resolution);
  context.fillStyle='#fafafa';
  return {...spec,bitmap,context,xMin,yMin,nextRow:spec.start};
}

function buildBands(bands,metrics,rowBudget){
  let remaining=rowBudget,built=0;
  for(const band of bands){
    while(band.nextRow<band.end&&remaining>0){
      const r=band.nextRow++;
      for(let k=0;k<=r;k++)if(isOddPascal(r,k)){
        const x=(k-r/2)*metrics.stepX,y=r*metrics.stepY;
        band.context.fillRect(x-metrics.cellW/2,y-metrics.cellH/2,metrics.cellW,metrics.cellH);
      }
      remaining--;built++;
    }
    if(!remaining)break;
  }
  return built;
}

function createPascalHero(region,canvas,{interactive=true}={}){
  const surface=canvasSurface(canvas);
  const motion={time:0,speed:0,acceleration:0,target:0,manual:false};
  let bands=[],bandKey='',builtRows=0,lastFrame='';

  function setTarget(reveal){motion.manual=false;motion.target=reveal?1:0}
  function syncBands(metrics){
    const key=metrics.stepX.toFixed(4)+':'+metrics.stepY.toFixed(4);
    if(key===bandKey)return;
    bands=DEEP_BANDS.map(spec=>createBand(spec,metrics));
    bandKey=key;builtRows=0;lastFrame='';
  }
  function prepare(){
    const {width,height}=surface.resize();if(width<2||height<2)return;
    const metrics=geometry(width,height);syncBands(metrics);
    builtRows+=buildBands(bands,metrics,Infinity);
  }
  // Fixed-time export can call seek(t), then update(0), for deterministic frames.
  function seek(seconds){
    motion.manual=true;motion.time=clamp(seconds,0,PASCAL_SEQUENCE_DURATION);
    motion.speed=0;motion.acceleration=0;lastFrame='';
    if(motion.time>ZOOM_START)prepare();
  }
  if(interactive){
    region.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')setTarget(true)});
    region.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')setTarget(false)});
    region.addEventListener('focus',()=>setTarget(true));
    region.addEventListener('blur',()=>setTarget(false));
    region.addEventListener('click',e=>{if(e.pointerType==='touch'||!matchMedia('(hover: hover)').matches)setTarget(!motion.target)});
    region.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setTarget(!motion.target)}});
  }

  return {duration:PASCAL_SEQUENCE_DURATION,get time(){return motion.time},get cameraScale(){return pascalCameraScale(motion.time)},setTarget,seek,prepare,update(dt){
    if(!motion.manual){
      const atEnd=motion.target?motion.time>=PASCAL_SEQUENCE_DURATION:motion.time<=0;
      if(atEnd){motion.speed=0;motion.acceleration=0}
      else{
        const next=smoothDamp(motion.speed,motion.target?1:-1,motion.acceleration,reducedMotion?.07:.22,dt);
        motion.speed=next.value;motion.acceleration=next.velocity;
        motion.time=clamp(motion.time+motion.speed*dt,0,PASCAL_SEQUENCE_DURATION);
      }
    }
    const {ctx,width:w,height:h}=surface.resize();if(w<2||h<2)return;
    const metrics=geometry(w,h);syncBands(metrics);
    if(builtRows<1024-rows.length)builtRows+=buildBands(bands,metrics,64);
    const frameKey=canvas.width+':'+canvas.height+':'+motion.time.toFixed(4)+':'+builtRows+':'+canvasBackground();
    if(frameKey===lastFrame)return;lastFrame=frameKey;
    clear(ctx,w,h);
    const t=motion.time,focus=smoothstep(0,.45,t),retract=smoothstep(.35,1.1,t);
    const encode=smoothstep(1.1,1.8,t),numberFade=smoothstep(1.65,ZOOM_START,t);
    const cameraScale=pascalCameraScale(t);
    const {stepX,stepY,apexX,apexY,cellW,cellH}=metrics;
    const point=(r,k)=>({x:(k-r/2)*stepX,y:r*stepY});
    ctx.save();ctx.translate(apexX,apexY);ctx.scale(cameraScale,cameraScale);

    // The shallow diagonal guides still withdraw toward their left endpoints.
    for(let diagonal=4;diagonal<=10;diagonal++){
      const cells=[];
      for(let k=0;k<=Math.floor(diagonal/2);k++){const r=diagonal-k;if(r<rows.length&&k<=r)cells.push(point(r,k))}
      if(cells.length<2)continue;
      const left=cells[0],right=cells[cells.length-1],amount=1-retract;
      if(amount<=0)continue;
      ctx.beginPath();ctx.moveTo(left.x,left.y);ctx.lineTo(left.x+(right.x-left.x)*amount,left.y+(right.y-left.y)*amount);
      ctx.strokeStyle='rgba(218,170,80,'+((.34+.23*focus)*(1-retract))+')';ctx.lineWidth=1;ctx.stroke();
    }
    for(let r=0;r<rows.length;r++)for(let k=0;k<=r;k++){
      const {x,y}=point(r,k),odd=isOddPascal(r,k);
      ctx.fillStyle=odd?'rgba(250,250,250,'+encode+')':'rgba(0,0,0,'+encode+')';
      ctx.fillRect(x-cellW/2,y-cellH/2,cellW,cellH);
      ctx.strokeStyle='rgba(240,240,240,'+(.085+.14*focus)*(1-encode)+')';ctx.lineWidth=.65;ctx.strokeRect(x-cellW/2,y-cellH/2,cellW,cellH);
      ctx.globalAlpha=(1-numberFade)*(.54+.25*focus);
      const tone=odd?Math.round(245*(1-encode)):245;
      ctx.fillStyle='rgb('+tone+' '+tone+' '+tone+')';ctx.font='700 '+Math.max(10,stepY*.55)+'px Manrope,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(rows[r][k]),x,y+.4,cellW*.95);
      ctx.globalAlpha=1;
    }

function buildSquares(count){

const MAX_INDEX=10000, SCALE=10n**40n, PHI_SCALED=16180339887498948482045868343656381177203n;

function equationValue(text,maxLength=26){
  const value=document.createElement('span');
  value.className='reel-value';value.textContent=short(text,maxLength);value.title=text;
  return value;
}
function slotCapacity(slot){return Math.max(8,Math.min(26,Math.floor((slot.clientWidth-8)/(11*.61))))}
function animateEquation(stage,slots,values,direction){
  const travel=direction>=0?-1:1;
  const duration=reducedMotion?110:440;
  slots.forEach((slot,i)=>{
    const prior=slot.lastElementChild;
    const incoming=equationValue(values[i],slotCapacity(slot));
    if(!prior){slot.replaceChildren(incoming);return}
    const previousTransform=getComputedStyle(prior).transform;

function createMechanics({canvas,state,workspace,preview=false}){

    value.style.fontSize=`${Math.max(22,Math.min(58,(display.clientWidth-38)/(Math.max(1,leading+tail*.52)*.58)))}px`;
  }
  const controls=section('01 / Roller');controls.append(rangeControl('Auto Roll Speed',state.speed,.2,3,.1,v=>state.speed=v,v=>`${v.toFixed(1)}×`).el);panel.append(controls);
  const playback=section('02 / Playback');playback.append(actions([['Play',()=>{state.playing=true;state.autoTimer=0},'primary'],['Pause',()=>state.playing=false],['Reset',()=>{state.playing=false;state.position=11;state.velocity=0;state.activeIndex=11;refresh(true)}]]));panel.append(playback);
  const hint=document.createElement('p');hint.className='panel-description';hint.textContent='Drag, swipe, scroll, or use the arrow keys. The wheel keeps its momentum and settles on an exact Fibonacci term.';panel.append(hint);
  const events=new AbortController();let dragging=false,lastY=0,lastTime=0;

  wheel.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(e.key)){e.preventDefault();manual();const change=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:e.key==='PageUp'?-5:5;state.velocity=0;state.position=clamp(e.key==='Home'?2:e.key==='End'?MAX_INDEX:Math.round(state.position)+change,2,MAX_INDEX);refresh()}},{signal:events.signal});
  function refresh(force=false){const index=clamp(Math.round(state.position),2,MAX_INDEX);if(!force&&index===state.activeIndex)return;
    const direction=index-state.activeIndex;state.activeIndex=index;const data=ratio(index);
    fraction.textContent=`${short(data.numerator,32)} / ${short(data.denominator,32)}`;fraction.title=`${data.numerator} / ${data.denominator}`;
    const leading=document.createElement('span'),tail=document.createElement('span');
    leading.className='ratio-leading';tail.className='ratio-tail';
    leading.textContent=data.decimal.slice(0,7);tail.textContent=data.decimal.slice(7);

}

const app=document.querySelector('#app');app.className='app-shell';
const overview=createOverview(open);const workspace=createWorkspace(close);app.append(overview.el,workspace.el);
const factories={fibonacci:createFibonacci,phyllotaxis:createPhyllotaxis,petals:createPetals,mechanics:createMechanics};

for(const control of document.querySelectorAll('[data-appearance-toggle]')){
  control.addEventListener('click',()=>{
    state.appearance=appearanceMode()==='graphite'?'true-black':'graphite';
    setAppearance(state.appearance);
    syncAppearance();
  });
}
function syncAppearance(){
  for(const control of document.querySelectorAll('[data-appearance-toggle]')){
    const black=appearanceMode()==='true-black';
    control.querySelector('span').textContent=black?'TRUE BLACK':'GRAPHITE';

}
syncAppearance();

function transitionSheet(card){
  const rect=card.getBoundingClientRect(),sheet=document.createElement('div');sheet.className='transition-rect';
  sheet.textContent=card.querySelector('h2')?.textContent||'GOLDEN LAB';
  const preview=card.querySelector('canvas');
  if(preview?.width)try{sheet.style.backgroundImage=`linear-gradient(180deg, transparent 35%, ${canvasBackground()} 100%), url(${preview.toDataURL('image/png')})`}catch{sheet.style.backgroundColor=canvasBackground()}
  document.body.append(sheet);
  const start={left:`${rect.left}px`,top:`${rect.top}px`,width:`${rect.width}px`,height:`${rect.height}px`,borderRadius:'3px',fontSize:getComputedStyle(card.querySelector('h2')).fontSize,opacity:1};
  const end={left:'0px',top:'0px',width:`${innerWidth}px`,height:`${innerHeight}px`,borderRadius:'0px',fontSize:`${Math.min(65,innerWidth*.045)}px`,opacity:1};
  return {sheet,start,end};
}
function open(id,card){
  if(transitioning)return;transitioning=true;originCard=card;active=id;overview.el.classList.add('dimmed');
  workspace.setExperiment(id);
  activeInstance?.dispose?.();activeInstance=factories[id]({canvas:workspace.canvas,state:state[id],workspace});
  document.body.classList.add('workspace-open');
  workspace.el.classList.add('visible','is-opening');
  workspace.el.style.pointerEvents='none';
  workspace.el.setAttribute('aria-hidden','false');

  const {sheet,start,end}=transitionSheet(card),duration=720;
  const sheetAnimation=sheet.animate([start,{...end,opacity:1,offset:.67},{...end,opacity:0,offset:1}],{duration,easing:'cubic-bezier(.19,.76,.25,1)',fill:'forwards'});
  const workspaceAnimation=workspace.el.animate([{opacity:0,offset:0},{opacity:0,offset:.66},{opacity:1,offset:1}],{duration,easing:'ease-out',fill:'forwards'});
  const panelAnimation=workspace.panel.animate([{opacity:0,transform:'translateX(18px)'},{opacity:1,transform:'translateX(0)'}],{duration:duration*.35,delay:duration*.65,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});

  updateAppearance(dt);

  if(!active){pascal.update(dt);if(frame%2===0)for(const instance of Object.values(previewInstances))instance.update(dt*2,time)}

});
